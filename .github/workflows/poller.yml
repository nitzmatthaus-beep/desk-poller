name: poller
# PAPER ONLY public-data observer. No secrets besides the built-in GITHUB_TOKEN (push to the 'data' branch of this repo).
on:
  schedule:
    - cron: '3-59/5 * * * *'   # offset from :00 (GitHub drops many top-of-hour */5 slots)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poller
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: fetch inputs and previous data
        run: |
          for b in inputs data; do git fetch -q --depth=1 origin "+refs/heads/$b:refs/remotes/origin/$b" || echo "no $b branch yet"; done
          git show origin/inputs:inputs.json > /tmp/inputs.json 2>/dev/null || echo '{}' > /tmp/inputs.json
          git show origin/data:poll.json > /tmp/prev.json 2>/dev/null || echo '{}' > /tmp/prev.json
      - name: poll public data
        id: poll
        run: |
          set +e
          python3 poller.py /tmp/inputs.json /tmp/prev.json /tmp/poll.json
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; elif [ $rc -eq 3 ]; then echo "changed=0" >> "$GITHUB_OUTPUT"; else exit $rc; fi
      - name: publish data branch (single commit, only if changed)
        if: steps.poll.outputs.changed == '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/pub && cp /tmp/poll.json /tmp/pub/poll.json && cd /tmp/pub
          git init -q -b data
          git add poll.json
          git -c user.name=desk-poller -c user.email=desk-poller@users.noreply.github.com commit -q -m "poll $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
